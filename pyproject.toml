[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowevent"
version = "2.0.0"
description = "FlowEvent: in-process event delivery for Python."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["event-bus", "event-driven", "asyncio", "pub-sub"]
authors = [
  { name = "TahsinCr", email = "Tahsincr@outlook.com" },
]

dependencies = [
  "backports.strenum>=1.3.1,<2; python_version < '3.11'",
  "exceptiongroup>=1.3.1,<2; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/TahsinCr/python-flowevent"
Repository = "https://github.com/TahsinCr/python-flowevent"
Changelog = "https://github.com/TahsinCr/python-flowevent/blob/main/CHANGELOG.md"
Issues = "https://github.com/TahsinCr/python-flowevent/issues"

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "pyperf>=2.7,<3",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
  "setuptools>=77",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowevent", "flowevent.*"]

[tool.setuptools.package-data]
flowevent = ["py.typed", "_core.pyi"]

[tool.setuptools.exclude-package-data]
flowevent = ["*.c"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".serena", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B023"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["flowevent"]
exclude = ["tests"]

[tool.cibuildwheel]
build-verbosity = 1
skip = ["pp*", "*-manylinux_i686", "*-musllinux_i686", "*-win32"]
test-command = [
  "python -c \"import sys, sysconfig; from flowevent._native import CORE; assert CORE is not None; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled()\"",
  "python -m unittest discover -s \"{project}/tests\" -p test_native_core.py",
]
