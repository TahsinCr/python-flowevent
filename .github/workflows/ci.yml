name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      free_threaded_sanitizers:
        description: Run the optional free-threaded native sanitizer job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests with the compiled extension
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.10'
        run: python run_tests.py

      - name: Run unit tests with the pure-Python fallback
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.10'
        env:
          EVENTFLOW_NO_EXTENSIONS: "1"
        run: python run_tests.py

      - name: Measure package and branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install "coverage>=7.6,<8"
          python -m coverage run --branch --source=flowevent -m unittest discover -s tests
          EVENTFLOW_NO_EXTENSIONS=1 python -m coverage run -a --branch --source=flowevent -m unittest discover -s tests
          python -m coverage report --include="flowevent/*" --fail-under=88
          python -m coverage report --include="flowevent/callback.py" --fail-under=86
          python -m coverage report --include="flowevent/_callbacks.py" --fail-under=84
          python -m coverage report --include="flowevent/base.py" --fail-under=90
          python -m coverage report --include="flowevent/async_event_bus.py" --fail-under=89
          python -m coverage report --include="flowevent/bridges.py" --fail-under=80

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint rules
        run: |
          ruff check .
          ruff format --check .

  typing:
    name: Pyright Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check public package types
        run: |
          pyright --pythonversion "${{ matrix.python-version }}"
          pyright benchmarks/*.py --pythonversion "${{ matrix.python-version }}"

  free-threaded:
    name: Python ${{ matrix.python-version }} with GIL disabled on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14t", "3.15t"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up free-threaded Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify GIL is disabled
        env:
          PYTHON_GIL: "0"
        run: |
          python -c 'import sys, sysconfig; import flowevent._native as native; assert native.CORE is not None; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled()'

      - name: Run unit tests without the GIL
        env:
          PYTHON_GIL: "0"
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error
        run: python run_tests.py

      - name: Run pure-Python unit tests without the GIL
        env:
          PYTHON_GIL: "0"
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error
          EVENTFLOW_NO_EXTENSIONS: "1"
        run: python run_tests.py

  dependency-audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install dependency audit tool
        run: python -m pip install "pip-audit>=2.7,<3"

      - name: Audit declared runtime dependencies
        run: pip-audit .

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install distribution tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify and test the source distribution
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          archive = max(
              Path("dist").glob("*.tar.gz"),
              key=lambda candidate: candidate.stat().st_mtime_ns,
          )
          with tarfile.open(archive, "r:gz") as source_archive:
              members = source_archive.getnames()
              root_name = members[0].split("/", 1)[0]
              relative_members = {
                  name[len(root_name) + 1 :]
                  for name in members
                  if name.startswith(root_name + "/")
              }
              required = {
                  "setup.py",
                  "MANIFEST.in",
                  "LICENSE",
                  "flowevent/_core.c",
                  "flowevent/_core.pyi",
                  "flowevent/py.typed",
                  "tests/test_native_core.py",
                  "tests/api_contract.json",
              }
              missing = required - relative_members
              assert not missing, f"source distribution is missing: {sorted(missing)}"
              binaries = sorted(
                  name
                  for name in relative_members
                  if name.endswith((".so", ".pyd", ".dll", ".dylib"))
              )
              assert not binaries, f"prebuilt binaries were packaged in sdist: {binaries[:5]}"
              generated = sorted(
                  name for name in relative_members if name.startswith("benchmarks/results/")
              )
              assert not generated, f"generated benchmark results were packaged: {generated[:5]}"

              with tempfile.TemporaryDirectory() as temporary_directory:
                  source_archive.extractall(temporary_directory)
                  source_root = Path(temporary_directory) / root_name
                  subprocess.run(
                      [sys.executable, "-m", "pip", "install", f"{source_root}[dev]"],
                      check=True,
                  )
                  environment = os.environ.copy()
                  existing_pythonpath = environment.get("PYTHONPATH")
                  environment["PYTHONPATH"] = str(source_root) + (
                      os.pathsep + existing_pythonpath if existing_pythonpath else ""
                  )
                  subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "unittest",
                          "discover",
                          "--start-directory",
                          "tests",
                      ],
                      cwd=source_root,
                      env=environment,
                      check=True,
                  )
          PY

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Build a wheel from the source distribution
        run: |
          python -m build --wheel --outdir "${{ runner.temp }}/from-sdist" dist/*.tar.gz
          EVENTFLOW_PURE_PYTHON=1 python -m build --wheel --outdir "${{ runner.temp }}/pure-wheel" dist/*.tar.gz
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          pure_wheels = list((Path(os.environ["RUNNER_TEMP"]) / "pure-wheel").glob("*.whl"))
          assert len(pure_wheels) == 1 and pure_wheels[0].name.endswith("-py3-none-any.whl"), pure_wheels
          with zipfile.ZipFile(pure_wheels[0]) as archive:
              names = archive.namelist()
              assert "flowevent/py.typed" in names
              assert "flowevent/_core.pyi" in names
              assert not any(name.endswith((".so", ".pyd", ".c")) for name in names), names
          PY

      - name: Install the source-built wheel
        run: python -m pip install "${{ runner.temp }}/from-sdist/"*.whl

      - name: Verify installed package metadata, typing marker, and runtime API
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import asyncio
          import os
          import subprocess
          import sys

          import flowevent
          import flowevent._native as native

          pkg_dir = Path(flowevent.__file__).parent
          assert version("flowevent") == flowevent.__version__
          assert (pkg_dir / "py.typed").is_file()
          assert (pkg_dir / "_core.pyi").is_file()
          assert not (pkg_dir / "_core.c").exists()
          assert native.CORE is not None
          fallback_env = os.environ.copy()
          fallback_env["EVENTFLOW_NO_EXTENSIONS"] = "1"
          subprocess.run(
              [
                  sys.executable,
                  "-c",
                  "import flowevent, flowevent._native as n; assert n.CORE is None; "
                  "b = flowevent.EventBus(); b.subscribe(lambda _: None); "
                  "assert b.publish(1).delivered == 1",
              ],
              env=fallback_env,
              check=True,
          )
          assert flowevent.EventEnvelope[int](1).event == 1

          async def smoke():
              with flowevent.EventBus[int]() as bus:
                  async with flowevent.AsyncEventQueue(bus) as queue:
                      assert bus.publish(3).delivered == 1
                      assert await queue.receive() == 3
          asyncio.run(smoke())
          PY

  native-coverage:
    name: Native C line, branch, and function coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install isolated coverage tools
        run: python -m pip install "setuptools>=77" "gcovr==8.8" "pyperf==2.11.0" "hypothesis>=6,<7"

      - name: Build, test, and measure the native C extension
        run: python tools/native_coverage.py --output-dir build/native-c-coverage

      - name: Upload native C coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-c-coverage
          path: build/native-c-coverage/
          if-no-files-found: warn
          retention-days: 14

  native-safety:
    name: Native C sanitizers and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]" "setuptools>=77"

      - name: Analyze native C source with GCC
        run: >-
          gcc -fanalyzer -fsyntax-only -Wall -Wextra -Werror
          -I"$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          flowevent/_core.c

      - name: Build the extension with AddressSanitizer and UBSan
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
          LDFLAGS: -fsanitize=address,undefined
        run: python setup.py build_ext --inplace --force

      - name: Run native dispatch tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONPATH: tests
        run: >-
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          python -m unittest test_native_core test_bus test_routing_key
          test_bridges test_async_queue

  free-threaded-safety:
    if: github.event_name == 'workflow_dispatch' && inputs.free_threaded_sanitizers
    name: Free-threaded native ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up free-threaded Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15t"

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]" "setuptools>=77"

      - name: Verify free-threaded runtime and native core
        env:
          PYTHON_GIL: "0"
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -c 'import sys, sysconfig; import flowevent._native as native; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled(); assert native.CORE is not None'

      - name: Build the extension with AddressSanitizer and UBSan
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
          LDFLAGS: -fsanitize=address,undefined
        run: python setup.py build_ext --inplace --force

      - name: Verify sanitized core keeps the GIL disabled
        env:
          PYTHON_GIL: "0"
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -c 'import sys, sysconfig; import flowevent._native as native; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1; assert not sys._is_gil_enabled(); assert native.CORE is not None'

      - name: Run native concurrency tests with the GIL disabled
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHON_GIL: "0"
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error
          PYTHONPATH: tests
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          python -m unittest test_native_core test_bus test_routing_key test_bridges test_async_queue test_subscription test_async_bus
